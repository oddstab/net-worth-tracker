<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="description" content="個人資產追蹤器 - 管理您的資產與負債" />
  <title>Net Worth Tracker</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  
  <!-- Google APIs -->
  <script src="https://apis.google.com/js/api.js" defer></script>
</head>
<body>
  <!-- Top Navigation Bar -->
  <nav class="navbar" role="navigation" aria-label="主導覽">
    <div class="navbar-brand">
      <span class="navbar-title">Net Worth Tracker</span>
    </div>
    <div class="navbar-tabs" role="tablist">
      <button
        class="nav-tab active"
        role="tab"
        aria-selected="true"
        aria-controls="page-dashboard"
        data-page="dashboard"
        id="tab-dashboard"
      >
        儀表板
      </button>
      <button
        class="nav-tab"
        role="tab"
        aria-selected="false"
        aria-controls="page-assets"
        data-page="assets"
        id="tab-assets"
      >
        資產
      </button>
      <button
        class="nav-tab"
        role="tab"
        aria-selected="false"
        aria-controls="page-settings"
        data-page="settings"
        id="tab-settings"
      >
        設定
      </button>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="main-content" id="main-content">

    <!-- Dashboard Page -->
    <section
      class="page active"
      id="page-dashboard"
      role="tabpanel"
      aria-labelledby="tab-dashboard"
    >
      <!-- Quick Stats: 4-grid numbers -->
      <div class="quick-stats" id="quick-stats" aria-label="快速數字總覽">
        <div class="stat-card">
          <span class="stat-label">資產月增率</span>
          <span class="stat-value" id="stat-monthly-growth">--</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">投資總額</span>
          <span class="stat-value" id="stat-investment-total">--</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">淨資產</span>
          <span class="stat-value" id="stat-net-worth">--</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">債務</span>
          <span class="stat-value" id="stat-liabilities-total">--</span>
        </div>
      </div>

      <!-- Pie Chart Section -->
      <section class="chart-section" aria-label="資產配置圓餅圖">
        <h2 class="section-title">資產配置</h2>
        <div class="pie-chart-container">
          <div class="pie-chart-wrapper">
            <canvas id="pie-chart" aria-label="資產配置圓餅圖" role="img"></canvas>
            <div class="pie-chart-center" id="pie-chart-center">
              <span class="pie-net-worth-label">淨資產</span>
              <div class="pie-net-worth-value" id="pie-net-worth">--</div>
            </div>
          </div>
          <div class="pie-legend" id="pie-legend" aria-label="圓餅圖圖例">
            <!-- Rendered by dashboard.js -->
          </div>
        </div>
        <div class="no-data-placeholder hidden" id="pie-no-data">
          <p>尚無資料</p>
        </div>
      </section>

      <!-- Trend Chart Section -->
      <section class="chart-section" aria-label="淨資產趨勢折線圖">
        <h2 class="section-title">資產趨勢</h2>
        <div class="trend-range-selector" role="group" aria-label="時間範圍選擇">
          <button class="range-btn active" data-range="1w">1週</button>
          <button class="range-btn" data-range="1m">1月</button>
          <button class="range-btn" data-range="6m">6月</button>
          <button class="range-btn" data-range="1y">1年</button>
          <button class="range-btn" data-range="all">全部</button>
        </div>
        <div class="trend-chart-container">
          <canvas id="trend-chart" aria-label="淨資產趨勢折線圖" role="img"></canvas>
        </div>
        <div class="no-data-placeholder hidden" id="trend-no-data">
          <p>該時間範圍內無資料</p>
        </div>
      </section>
    </section>

    <!-- Assets Page -->
    <section
      class="page hidden"
      id="page-assets"
      role="tabpanel"
      aria-labelledby="tab-assets"
    >
      <div class="asset-list-container" id="asset-list-container">
        <!-- Rendered by assetList.js -->
        <div class="empty-state hidden" id="empty-state">
          <p class="empty-state-text">點擊 + 新增第一筆資產</p>
        </div>
      </div>
    </section>

    <!-- Settings Page -->
    <section
      class="page hidden"
      id="page-settings"
      role="tabpanel"
      aria-labelledby="tab-settings"
    >
      <div class="settings-container" id="settings-container">
        <!-- Rendered by settings.js -->
      </div>
    </section>

  </main>

  <!-- FAB (Floating Action Button) -->
  <div class="fab-container">
    <div class="fab-menu hidden" id="fab-menu">
      <button class="fab-menu-item" id="fab-add-liability">
        <span class="fab-menu-icon">💳</span>
        <span class="fab-menu-label">新增負債</span>
      </button>
      <button class="fab-menu-item" id="fab-add-asset">
        <span class="fab-menu-icon">📈</span>
        <span class="fab-menu-label">新增資產</span>
      </button>
    </div>
    <button
      class="fab"
      id="fab-add"
      aria-label="新增資產或負債"
      aria-expanded="false"
      title="新增"
    >
      <span class="fab-icon" aria-hidden="true">+</span>
    </button>
  </div>

  <!-- Modal Overlay -->
  <div class="modal-overlay hidden" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">新增資產</h2>
        <button class="modal-close" id="modal-close" aria-label="關閉">✕</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Rendered by modal.js -->
      </div>
      <div class="modal-footer" id="modal-footer">
        <!-- Buttons will be moved here -->
      </div>
    </div>
  </div>

  <!-- Confirm Dialog (共用 modal 樣式) -->
  <div class="modal-overlay hidden" id="confirm-overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">確認刪除</h2>
        <button class="modal-close" id="confirm-close" aria-label="關閉">✕</button>
      </div>
      <div class="modal-body" style="text-align:center;">
        <div style="font-size:2.5rem; margin-bottom:var(--spacing-md);">🗑️</div>
        <div id="confirm-message" style="font-size:var(--font-size-base); color:var(--text-primary); line-height:1.6;"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="confirm-cancel">取消</button>
        <button class="btn btn-danger" id="confirm-ok">刪除</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast hidden" id="toast" role="alert" aria-live="polite"></div>

  <!-- App Entry Point (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
