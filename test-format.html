<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>測試數字格式化</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #1a1a2e;
      color: #e8e8f0;
    }
    .test-result {
      margin: 10px 0;
      padding: 10px;
      background: #1e1e30;
      border-radius: 8px;
      display: grid;
      grid-template-columns: 150px 200px 200px;
      gap: 15px;
      align-items: center;
    }
    .header {
      background: #2a2a45;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>數字格式化測試</h1>
  <p><strong>完整格式</strong>：用於最上面的淨資產卡片</p>
  <p><strong>簡潔格式</strong>：用於圓餅圖中央</p>
  
  <div class="test-result header">
    <div>原值</div>
    <div>完整格式</div>
    <div>簡潔格式</div>
  </div>
  <div id="results"></div>

  <script>
    function formatNTD(value) {
      return 'NT$' + Math.round(value).toLocaleString('zh-TW');
    }

    function formatNTDCompact(value) {
      const absValue = Math.abs(value);
      const roundedValue = Math.round(value);
      
      if (absValue >= 1000000) {
        const wanValue = roundedValue / 10000;
        const sign = value < 0 ? '-' : '';
        
        if (wanValue >= 1000) {
          return `${sign}NT$${(wanValue / 1000).toFixed(1)}千萬`;
        } else {
          return `${sign}NT$${Math.round(wanValue)}萬`;
        }
      } else {
        return 'NT$' + roundedValue.toLocaleString('zh-TW');
      }
    }

    const testValues = [
      500000,      // 50萬
      999999,      // 99.9萬
      1000000,     // 100萬
      1500000,     // 150萬
      2157803,     // 215.78萬
      3997803,     // 399.78萬
      10000000,    // 1000萬
      15000000,    // 1500萬
      -1840000,    // -184萬
    ];

    const resultsEl = document.getElementById('results');
    
    testValues.forEach(value => {
      const full = formatNTD(value);
      const compact = formatNTDCompact(value);
      resultsEl.innerHTML += `
        <div class="test-result">
          <div>${value.toLocaleString()}</div>
          <div>${full}</div>
          <div>${compact}</div>
        </div>
      `;
    });
  </script>
</body>
</html>
