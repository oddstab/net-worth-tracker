<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>股票整合測試</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background: #0f0f1a;
      color: #e8e8f0;
    }
    .test-section {
      background: #1e1e30;
      border: 1px solid #2a2a45;
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
    }
    .asset-item {
      background: #252540;
      border-radius: 8px;
      padding: 15px;
      margin: 10px 0;
      border: 1px solid #2a2a45;
    }
    .asset-name {
      font-weight: 600;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      color: #d946ef;
    }
    .asset-details {
      margin-top: 8px;
      font-size: 14px;
      color: #a0a0b8;
    }
    .multiple-badge {
      background: rgba(217, 70, 239, 0.15);
      color: #d946ef;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 8px;
    }
    button {
      background: #d946ef;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #e879f9;
    }
  </style>
</head>
<body>
  <h1>股票整合功能測試</h1>
  
  <div class="test-section">
    <h2>測試數據</h2>
    <p>這個頁面測試相同股票的整合功能，確保：</p>
    <ul>
      <li>股票代號顯示在最前面</li>
      <li>相同股票會被整合在一起</li>
      <li>顯示多筆持股的標記</li>
    </ul>
    
    <button onclick="addTestData()">添加測試數據</button>
    <button onclick="clearData()">清除數據</button>
    <button onclick="testConsolidation()">測試整合功能</button>
  </div>

  <div class="test-section">
    <h2>整合結果</h2>
    <div id="results"></div>
  </div>

  <script type="module">
    import { consolidateAssets } from './js/ui/assetList.js';

    // 測試數據
    const testAssets = [
      {
        id: '1',
        name: '元大台灣50正2',
        symbol: '00631L',
        category: 'investment',
        type: 'tw_stock',
        quantity: 1000,
        pricePerUnit: 15.5,
        currency: 'TWD'
      },
      {
        id: '2',
        name: '元大台灣50正2',
        symbol: '00631L',
        category: 'investment',
        type: 'tw_stock',
        quantity: 500,
        pricePerUnit: 16.2,
        currency: 'TWD'
      },
      {
        id: '3',
        name: '智邦',
        symbol: '2345',
        category: 'investment',
        type: 'tw_stock',
        quantity: 2000,
        pricePerUnit: 60.8,
        currency: 'TWD'
      },
      {
        id: '4',
        name: '群益臺灣加權正2',
        symbol: '00685L',
        category: 'investment',
        type: 'tw_stock',
        quantity: 800,
        pricePerUnit: 31.9,
        currency: 'TWD'
      },
      {
        id: '5',
        name: '元大台灣50正2',
        category: 'investment',
        type: 'tw_stock',
        quantity: 300,
        pricePerUnit: 15.8,
        currency: 'TWD'
      }
    ];

    function renderAsset(asset) {
      const isMultiple = asset.holdings && asset.holdings.length > 1;
      const displayName = asset.symbol 
        ? `${asset.symbol} ${asset.name}`
        : asset.name;
      
      return `
        <div class="asset-item">
          <div class="asset-name">
            ${displayName}
            ${isMultiple ? `<span class="multiple-badge">${asset.holdings.length}筆</span>` : ''}
          </div>
          <div class="asset-details">
            總數量: ${asset.quantity.toLocaleString('zh-TW')} | 
            平均成本: ${asset.pricePerUnit.toFixed(2)} TWD | 
            總價值: NT$${(asset.quantity * asset.pricePerUnit).toLocaleString('zh-TW')}
          </div>
          ${isMultiple ? `
            <div style="margin-top: 10px; font-size: 12px;">
              <strong>持股明細:</strong><br>
              ${asset.holdings.map(h => 
                `• ${h.quantity.toLocaleString('zh-TW')} @ ${h.pricePerUnit.toFixed(2)} TWD`
              ).join('<br>')}
            </div>
          ` : ''}
        </div>
      `;
    }

    window.addTestData = function() {
      localStorage.setItem('assets', JSON.stringify(testAssets));
      alert('測試數據已添加到 localStorage');
    };

    window.clearData = function() {
      localStorage.removeItem('assets');
      document.getElementById('results').innerHTML = '';
      alert('數據已清除');
    };

    window.testConsolidation = function() {
      // 使用私有函數進行測試，這裡我們直接實現整合邏輯
      const assets = JSON.parse(localStorage.getItem('assets') || '[]');
      
      if (assets.length === 0) {
        document.getElementById('results').innerHTML = '<p>請先添加測試數據</p>';
        return;
      }

      // 模擬整合邏輯
      const consolidated = consolidateAssetsLocal(assets, 31.5);
      
      const resultsHtml = `
        <h3>原始資產 (${assets.length} 筆)</h3>
        ${assets.map(renderAsset).join('')}
        
        <h3>整合後資產 (${consolidated.length} 筆)</h3>
        ${consolidated.map(renderAsset).join('')}
      `;
      
      document.getElementById('results').innerHTML = resultsHtml;
    };

    // 本地整合函數實現
    function consolidateAssetsLocal(assets, rate) {
      const symbolMap = {
        '元大台灣50正2': '00631L',
        '智邦': '2345',
        '群益臺灣加權正2': '00685L'
      };
      
      // 遷移：為沒有 symbol 的資產添加 symbol
      const migratedAssets = assets.map(asset => {
        if (!asset.symbol && asset.name) {
          const symbol = symbolMap[asset.name.trim()];
          if (symbol) {
            return { ...asset, symbol };
          }
        }
        return asset;
      });
      
      const consolidated = new Map();
      
      migratedAssets.forEach(asset => {
        let key = asset.symbol || asset.name.replace(/\s+/g, '').toLowerCase();
        
        if (consolidated.has(key)) {
          const existing = consolidated.get(key);
          const existingTotalValue = existing.quantity * existing.pricePerUnit;
          const currentTotalValue = asset.quantity * asset.pricePerUnit;
          const totalValue = existingTotalValue + currentTotalValue;
          const totalQuantity = existing.quantity + asset.quantity;
          
          const avgPrice = totalValue / totalQuantity;
          
          existing.quantity = totalQuantity;
          existing.pricePerUnit = avgPrice;
          existing.holdings.push(asset);
          
          if (asset.symbol && !existing.symbol) {
            existing.symbol = asset.symbol;
          }
        } else {
          consolidated.set(key, {
            ...asset,
            holdings: [asset]
          });
        }
      });
      
      return Array.from(consolidated.values());
    }
  </script>
</body>
</html>
