<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>測試今日漲跌幅</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #1a1a2e;
      color: #e8e8f0;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      background: #d946ef;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #e879f9;
    }
    .result {
      margin: 20px 0;
      padding: 15px;
      background: #1e1e30;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>測試今日漲跌幅功能</h1>
  
  <button onclick="addTestSnapshots()">添加測試快照資料</button>
  <button onclick="clearSnapshots()">清除所有快照</button>
  <button onclick="testGrowthRates()">測試成長率計算</button>
  
  <div id="result" class="result"></div>

  <script type="module">
    import { getState, setState } from './js/state.js';
    import { calculateGrowthRates } from './js/calculator.js';

    window.addTestSnapshots = function() {
      const today = new Date();
      const testSnapshots = [];
      
      // 創建過去7天的測試資料
      for (let i = 6; i >= 0; i--) {
        const date = new Date(today);
        date.setDate(date.getDate() - i);
        const dateStr = date.toISOString().split('T')[0];
        
        // 模擬淨資產變化（基準2,000,000，每天隨機變化）
        const baseValue = 2000000;
        const variation = (Math.random() - 0.5) * 100000; // ±50,000的變化
        const netWorth = baseValue + variation + (i * 10000); // 整體上升趨勢
        
        testSnapshots.push({
          date: dateStr,
          netWorth: Math.round(netWorth)
        });
      }
      
      setState({ snapshots: testSnapshots });
      document.getElementById('result').innerHTML = `
        <h3>已添加測試快照資料：</h3>
        <pre>${JSON.stringify(testSnapshots, null, 2)}</pre>
      `;
    };

    window.clearSnapshots = function() {
      setState({ snapshots: [] });
      document.getElementById('result').innerHTML = '<p>已清除所有快照資料</p>';
    };

    window.testGrowthRates = function() {
      const state = getState();
      const growthRates = calculateGrowthRates(state.snapshots);
      
      document.getElementById('result').innerHTML = `
        <h3>成長率計算結果：</h3>
        <p><strong>快照數量：</strong> ${state.snapshots.length}</p>
        <p><strong>今日漲跌幅：</strong> ${growthRates.dailyGrowthRate !== null ? growthRates.dailyGrowthRate.toFixed(2) + '%' : '無資料'}</p>
        <p><strong>月增率：</strong> ${growthRates.monthlyGrowthRate !== null ? growthRates.monthlyGrowthRate.toFixed(2) + '%' : '無資料'}</p>
        <p><strong>估算月增率：</strong> ${growthRates.estimatedMonthlyRate !== null ? growthRates.estimatedMonthlyRate.toFixed(2) + '%*' : '無資料'}</p>
        
        <h4>快照資料：</h4>
        <pre>${JSON.stringify(state.snapshots, null, 2)}</pre>
      `;
    };
  </script>
</body>
</html>
